name: coin-scan

on:
  schedule:
    # GitHub throttles this repo's scheduled runs to ~2-3/day regardless of the
    # minute (measured 2026-08-29: gaps of 5.2, 10.8, 9.9, 9.1, 12.0, 6.4h, and
    # moving :00 -> :37 changed nothing). We can't win more runs, so each run
    # now stays alive and polls on a loop instead — see the collect step below.
    - cron: "37 * * * *" # best-effort; expect most of these to be dropped
  workflow_dispatch: {} # manual run button in the Actions tab

permissions:
  contents: write
  issues: write # the alert step opens an issue to push a phone notification

concurrency:
  group: coin-scan
  # true, not false: runs are long-lived now, so a fresh scheduled run should
  # replace a stale one rather than queue behind it (queued runs get dropped).
  # Each cycle commits its own data, so cancelling only loses the current cycle.
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    # GitHub's hosted-runner ceiling is 360; leave slack so the loop's own
    # LOOP_MINUTES budget is what ends the run, not a hard kill mid-commit.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: collect on a loop
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          # ~5.5h of polling per run. Tune down if the idle runner time is a
          # concern; even 120 gives ~12 poll cycles against the old 1.
          LOOP_MINUTES: 330
          # Path sampling is the binding constraint: peak/trough/attention were
          # landing ~1 sample per 6h, far too coarse to locate an entry or exit.
          POLL_MINUTES: 10
          # Discovery is the expensive call (GeckoTerminal paginates at 2.1s/req)
          # and the trending list barely moves in 10 minutes, so scan hourly.
          SCAN_EVERY: 6
        run: |
          set -uo pipefail
          git config user.name "coin-bot"
          git config user.email "actions@users.noreply.github.com"

          alert_failed=0
          push_failed=0
          action_needed=0

          commit_cycle() {
            rm -f alert-body.md # scratch, never commit it
            git add -A .
            if git diff --cached --quiet; then
              echo "  no changes"
              return 0
            fi
            if ! git commit -q -m "auto: update + scan $(date -u +%FT%H:%M)"; then
              echo "::warning::git commit failed"
              return 1
            fi
            # a local push landing mid-run makes the rebase conflict; retry,
            # and never leave the runner stuck mid-rebase
            for i in 1 2 3; do
              if git pull --rebase -q && git push -q; then
                echo "  pushed"
                return 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            # A conflict against the owner's local push is deterministic, so
            # replaying it next cycle fails identically — and each cycle would
            # stack another unpushed commit onto the same conflict, wedging the
            # run for its remaining hours and losing everything when the runner
            # dies. Drop this cycle's commit and rejoin origin: the data is
            # regenerable (the next track/update re-polls it), a wedged run is
            # not. Flagged so the job still ends red, as it did before the loop.
            echo "::warning::push failed 3x — resetting to origin/main and dropping this cycle"
            push_failed=1
            git fetch -q origin && git reset -q --hard origin/main
            return 1
          }

          run_alert() {
            set +e
            node coin.js alert --commit-sent > alert-body.md
            rc=$?
            set -e
            if [ $rc -eq 3 ]; then
              echo "  nothing clears the alert gate"; rm -f alert-body.md; return 0
            fi
            if [ $rc -ne 0 ]; then
              echo "::error::coin.js alert failed with exit $rc"
              rm -f alert-body.md; alert_failed=1; return 0
            fi
            # if the issue cannot be created, drop alerts-sent.json so the next
            # cycle retries instead of silently swallowing the alert forever
            if ! gh issue create \
                  --title "[Coin] candidate(s) $(date -u +%F\ %H:%M) UTC" \
                  --body-file alert-body.md \
                  --assignee "$OWNER"; then
              echo '::error::gh issue create failed — reverting alerts-sent.json so the next cycle retries'
              git checkout -- alerts-sent.json 2>/dev/null || rm -f alerts-sent.json
              alert_failed=1
            fi
            rm -f alert-body.md
          }

          deadline=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          cycle=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            cycle=$((cycle + 1))
            started=$(date +%s)
            echo "── cycle $cycle  $(date -u +%FT%H:%M:%SZ) ──"

            # data collection first — a failure here must not block the commit.
            # timeout: getJson has no AbortSignal, so a merely *slow* upstream
            # (undici waits ~300s per request, ~90 tokens per scan) could run a
            # single cycle for hours; the loop only checks its deadline between
            # cycles, so nothing else would stop it before the job is killed.
            timeout 600 node coin.js track || echo "::warning::track failed"
            timeout 600 node coin.js update || echo "::warning::update failed"

            if [ $(( (cycle - 1) % SCAN_EVERY )) -eq 0 ]; then
              timeout 900 node coin.js scan || echo "::warning::scan failed"
              run_alert
            fi

            commit_cycle || true

            # Open positions hold real money; tracking rows do not. Checking
            # them once per 5.5h while polling research data every 10 minutes
            # is backwards, so watch runs every cycle. It exits non-zero only
            # when a position needs a decision — surface that immediately by
            # ending the run red (GitHub emails on a failed job) rather than
            # sitting on it for hours. Collection resumes on the next run.
            if ! node coin.js watch; then
              echo "::error::an open position needs a decision — see the watch output above"
              action_needed=1
              break
            fi

            # hold the cadence steady regardless of how long the cycle took, and
            # never start a cycle we cannot finish inside the run's budget
            elapsed=$(( $(date +%s) - started ))
            remaining=$(( deadline - $(date +%s) ))
            nap=$(( POLL_MINUTES * 60 - elapsed ))
            # if-blocks, not `[ ] && ...`: GitHub runs this step under `bash -e`,
            # where a trailing test that evaluates false would end the whole run
            if [ "$nap" -lt 0 ]; then nap=0; fi
            if [ "$remaining" -le "$nap" ]; then
              echo "budget spent after $cycle cycles"; break
            fi
            if [ "$nap" -gt 0 ]; then sleep "$nap"; fi
          done

          # Anything that must reach a human ends the job red, since a failed
          # job is the only notification channel this workflow has. Reported
          # only after the loop has committed everything it collected.
          rc=0
          if [ "$action_needed" = "1" ]; then
            echo "::error::an open position needs a decision"; rc=1
          fi
          if [ "$alert_failed" = "1" ]; then
            echo "::error::at least one alert cycle failed to notify"; rc=1
          fi
          # a run whose data never landed must go red, not silently vanish —
          # the pre-loop workflow treated this as fatal and so does this one
          if [ "$push_failed" = "1" ]; then
            echo "::error::at least one cycle could not push its data"; rc=1
          fi
          exit $rc

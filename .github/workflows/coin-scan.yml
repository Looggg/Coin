name: coin-scan

on:
  schedule:
    - cron: "0 * * * *" # hourly (UTC) — scheduled runs are best-effort, expect some skipped
  workflow_dispatch: {} # manual run button in the Actions tab

permissions:
  contents: write
  issues: write # the alert step opens an issue to push a phone notification

concurrency:
  group: coin-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # data collection first — a failure here must not block the commit
      - name: track scanned-token outcomes
        continue-on-error: true
        run: node coin.js track

      - name: update outcomes
        continue-on-error: true
        run: node coin.js update

      - name: discovery scan
        continue-on-error: true
        run: node coin.js scan

      # Phone notification path. GitHub's mobile app pushes on issue assignment,
      # so a qualifying candidate becomes an assigned issue. Deterministic:
      # `alert` is plain arithmetic over candidates.json, no model involved.
      # exit 3 = nothing cleared the gate, which is the normal, quiet case.
      # NOT continue-on-error: a notification path that silently fails forever
      # is the failure this step exists to prevent (same reasoning as `watch`
      # below). It runs after the data steps, so going red never costs data.
      - name: alert on notable candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          node coin.js alert --commit-sent > alert-body.md
          rc=$?
          set -e
          if [ $rc -eq 3 ]; then
            echo 'nothing clears the alert gate'; rm -f alert-body.md; exit 0
          fi
          if [ $rc -ne 0 ]; then
            echo "::error::coin.js alert failed with exit $rc"; rm -f alert-body.md; exit 1
          fi
          # if the issue cannot be created, drop alerts-sent.json so the next
          # run retries instead of silently swallowing the alert forever
          if ! gh issue create \
                --title "[Coin] candidate(s) $(date -u +%F\ %H:%M) UTC" \
                --body-file alert-body.md \
                --assignee ${{ github.repository_owner }}; then
            echo '::error::gh issue create failed — reverting alerts-sent.json so the next run retries'
            git checkout -- alerts-sent.json 2>/dev/null || rm -f alerts-sent.json
            rm -f alert-body.md
            exit 1
          fi
          rm -f alert-body.md

      - name: commit results
        run: |
          git config user.name "coin-bot"
          git config user.email "actions@users.noreply.github.com"
          # -A . stages whatever exists; naming journal.json explicitly would
          # abort the whole step until the first decision is logged
          rm -f alert-body.md # scratch, never commit it
          git add -A .
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto: update + scan $(date -u +%FT%H:%M)"
            # a local push landing mid-run makes the rebase conflict; retry,
            # and never leave the runner stuck mid-rebase
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase && git push; then
                echo "pushed"; pushed=1; break
              fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            # a run whose data never landed must go red, not silently vanish
            if [ "$pushed" != "1" ]; then
              echo "::error::failed to push scan results after 3 attempts (likely a rebase conflict)"
              exit 1
            fi
          fi

      # LAST on purpose: exits non-zero when a position needs action, so the
      # job goes red and GitHub emails. An alert nobody is told about is not
      # monitoring. Runs after the commit so it never blocks saving data.
      - name: watch open positions
        run: node coin.js watch
